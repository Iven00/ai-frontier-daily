<!doctype html><html lang="zh-Hant-TW" data-pwa-base="/ai-frontier-daily/preview/pwa/"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>目前離線｜MS</title><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1B1E23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/ai-frontier-daily/preview/pwa/manifest.webmanifest"><link rel="icon" href="/ai-frontier-daily/preview/pwa/icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/ai-frontier-daily/preview/pwa/icons/apple-touch-icon.png">
<style>
:root{--bg:#FBF7F1;--paper:#fff;--line:#EADFD0;--fg:#3A302A;--muted:#7A6E63;--pri:#C2643C;--teal:#2F6F6A}
@media (prefers-color-scheme:dark){:root{--bg:#1B1E23;--paper:#262A31;--line:#3A3F47;--fg:#ECE6DD;--muted:#ADA59B;--pri:#E8956F;--teal:#7CC4BA}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-wrap:anywhere}
main{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 40px}
.top{display:flex;align-items:center;gap:12px}.top img{border-radius:10px}.top b{display:block;font-size:1.05rem}.top small{color:var(--muted)}
h1{font-size:1.6rem;margin:22px 0 4px}p{margin:.4em 0;color:var(--muted)}
.btn{display:inline-flex;border:0;border-radius:999px;background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:10px 18px;margin:12px 0 18px;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}li a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--fg);text-decoration:none}

</style></head><body><main>
<div class="top"><img src="/ai-frontier-daily/preview/pwa/icons/icon-192.png" width="44" height="44" alt=""><div><b>Mirakee Signal</b><small>AI 前沿情報站</small></div></div>
<h1>📴 目前離線</h1><p>網路恢復後會自動顯示最新一期。下面是這台裝置已存下、離線也能看的頁面（Podcast 需要連線才能播放）。</p>
<button class="btn" type="button" onclick="location.reload()">重新連線</button>
<ul id="list"></ul><div class="empty" id="empty" hidden>還沒有存下的期數。連線時打開任何一期，之後離線也能看。</div>
</main><script>
(function () {
  var L = document.getElementById('list'), E = document.getElementById('empty'), base = new URL('/ai-frontier-daily/preview/pwa/', location.href);
  function label(p) { var m = /\/(daily|special)\/(\d{4}-\d{2}-\d{2})\/$/.exec(p); if (m) return (m[1] === 'special' ? '特別版 ' : '晨報 ') + m[2]; if (/\/archive\/$/.test(p)) return '所有期刊'; if (p === base.pathname) return '首頁'; return ''; }
  if (!window.caches) { E.hidden = false; return; }
  caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('ms-pwa-pages-') === 0; }).map(function (k) { return caches.open(k).then(function (c) { return c.keys().then(function (rs) { return Promise.all(rs.map(function (r) { return c.match(r).then(function (x) { return x.text().then(function (t) { return { u: r.url, t: t }; }); }); })); }); }); })); })
    .then(function (all) {
      var seen = {}, rows = [];
      [].concat.apply([], all).forEach(function (o) {
        var u = new URL(o.u); if (seen[u.pathname] || u.pathname.indexOf(base.pathname) !== 0 || /\/offline\/$/.test(u.pathname)) return; seen[u.pathname] = 1;
        var lb = label(u.pathname); if (!lb) return; var ti = (/<title>([^<]*)<\/title>/.exec(o.t) || [])[1] || '';
        rows.push({ p: u.pathname, lb: lb, ti: ti.replace(/｜MS$/, '') });
      });
      rows.sort(function (a, b) { var r = function (x) { return /\d{4}-\d{2}-\d{2}/.test(x.p) ? x.p.match(/\d{4}-\d{2}-\d{2}/)[0] : (x.lb === '首頁' ? '9' : '8'); }; return r(b) < r(a) ? -1 : 1; });
      rows.forEach(function (x) { var li = document.createElement('li'), a = document.createElement('a'); a.href = x.p; a.innerHTML = '<b></b><small></small>'; a.firstChild.textContent = x.lb; a.lastChild.textContent = x.ti; li.appendChild(a); L.appendChild(li); });
      E.hidden = rows.length > 0;
    }).catch(function () { E.hidden = false; });
})();
</script></body></html>
